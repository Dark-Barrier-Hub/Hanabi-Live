<script>
mountAuthModal();

// ─── MOBILE NAV TOGGLE ───
function toggleMobileNav() {
  const btn    = document.getElementById('navHamburger');
  const drawer = document.getElementById('navMobileDrawer');
  const isOpen = drawer.classList.contains('open');
  btn.classList.toggle('open', !isOpen);
  drawer.classList.toggle('open', !isOpen);
  // Prevent body scroll when drawer open
  document.body.style.overflow = isOpen ? '' : 'hidden';
}
window.toggleMobileNav = toggleMobileNav;

// Close drawer on resize to desktop
window.addEventListener('resize', () => {
  if (window.innerWidth > 768) {
    document.getElementById('navHamburger')?.classList.remove('open');
    document.getElementById('navMobileDrawer')?.classList.remove('open');
    document.body.style.overflow = '';
  }
});

// Close drawer when clicking outside
document.addEventListener('click', (e) => {
  const drawer = document.getElementById('navMobileDrawer');
  const btn    = document.getElementById('navHamburger');
  if (drawer?.classList.contains('open') && !drawer.contains(e.target) && !btn.contains(e.target)) {
    toggleMobileNav();
  }
});

// Sync mobile auth area with auth state
document.addEventListener('authStateChanged', (e) => {
  const user = e.detail;
  const mobileAuth = document.getElementById('navMobileAuth');
  if (!mobileAuth) return;
  if (user) {
    const profile = window.getProfileCache?.() || {};
    const name = profile.name || user.displayName || 'User';
    mobileAuth.innerHTML = `
      <a class="btn btn-outline" href="profile.html" style="text-decoration:none;flex:1;text-align:center;">👤 ${name}</a>
      <button class="btn btn-primary" onclick="doSignOut()" style="flex:1;">Sign Out</button>`;
  } else {
    mobileAuth.innerHTML = `
      <button class="btn btn-outline" onclick="openModal('login');toggleMobileNav()" style="flex:1;">Log In</button>
      <button class="btn btn-primary" onclick="openModal('register');toggleMobileNav()" style="flex:1;">Sign Up</button>`;
  }
});

let ALL_ANIME = [];
let currentFilter = 'All';
let currentSort = 'score';

async function init() {
  const res  = await fetch('data/anime.json');
  ALL_ANIME  = await res.json();
  buildFilters();
  renderGrid();
}

function buildFilters() {
  const allGenres = ALL_ANIME.flatMap(a => Array.isArray(a.genre) ? a.genre : [a.genre]);
  const genres = ['All', ...new Set(allGenres)].sort((a, b) => a === 'All' ? -1 : a.localeCompare(b));
  document.getElementById('filterChips').innerHTML = genres.map(g =>
    `<button class="filter-chip ${g === currentFilter ? 'active' : ''}" onclick="setFilter('${g}')">${g}</button>`
  ).join('');
}

function setFilter(g) {
  currentFilter = g;
  buildFilters();
  renderGrid();
}

function setSort(s, btn) {
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function filterAnime() { renderGrid(); }

function renderGrid() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = [...ALL_ANIME];

  if (currentFilter !== 'All') list = list.filter(a => (Array.isArray(a.genre) ? a.genre : [a.genre]).includes(currentFilter));
  if (q) list = list.filter(a => a.title.toLowerCase().includes(q) || (Array.isArray(a.genre) ? a.genre : [a.genre]).join(' ').toLowerCase().includes(q) || a.desc.toLowerCase().includes(q));

  if (currentSort === 'score')  list.sort((a,b) => b.score - a.score);
  if (currentSort === 'year')   list.sort((a,b) => b.year - a.year);
  if (currentSort === 'ep')     list.sort((a,b) => b.ep - a.ep);
  if (currentSort === 'title')  list.sort((a,b) => a.title.localeCompare(b.title));

  document.getElementById('resultsCount').innerHTML = `Showing <strong>${list.length}</strong> anime`;

  document.getElementById('browseGrid').innerHTML = list.length
    ? list.map(makeCard).join('')
    : `<div class="empty-state">
         <span class="empty-icon">🔍</span>
         <div class="empty-text">No results found</div>
         <div class="empty-sub">Try different keywords or clear your filters</div>
       </div>`;
}

init();

// '/' key auto-focus search
window.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});
</script>
