<script>
mountAuthModal();

// ─── MOBILE NAV TOGGLE ───
function toggleMobileNav() {
  const btn    = document.getElementById('navHamburger');
  const drawer = document.getElementById('navMobileDrawer');
  const isOpen = drawer.classList.contains('open');
  btn.classList.toggle('open', !isOpen);
  drawer.classList.toggle('open', !isOpen);
  // Prevent body scroll when drawer open
  document.body.style.overflow = isOpen ? '' : 'hidden';
}
window.toggleMobileNav = toggleMobileNav;

// Close drawer on resize to desktop
window.addEventListener('resize', () => {
  if (window.innerWidth > 768) {
    document.getElementById('navHamburger')?.classList.remove('open');
    document.getElementById('navMobileDrawer')?.classList.remove('open');
    document.body.style.overflow = '';
  }
});

// Close drawer when clicking outside
document.addEventListener('click', (e) => {
  const drawer = document.getElementById('navMobileDrawer');
  const btn    = document.getElementById('navHamburger');
  if (drawer?.classList.contains('open') && !drawer.contains(e.target) && !btn.contains(e.target)) {
    toggleMobileNav();
  }
});

// Sync mobile auth area with auth state
document.addEventListener('authStateChanged', (e) => {
  const user = e.detail;
  const mobileAuth = document.getElementById('navMobileAuth');
  if (!mobileAuth) return;
  if (user) {
    const profile = window.getProfileCache?.() || {};
    const name = profile.name || user.displayName || 'User';
    mobileAuth.innerHTML = `
      <a class="btn btn-outline" href="profile.html" style="text-decoration:none;flex:1;text-align:center;">👤 ${name}</a>
      <button class="btn btn-primary" onclick="doSignOut()" style="flex:1;">Sign Out</button>`;
  } else {
    mobileAuth.innerHTML = `
      <button class="btn btn-outline" onclick="openModal('login');toggleMobileNav()" style="flex:1;">Log In</button>
      <button class="btn btn-primary" onclick="openModal('register');toggleMobileNav()" style="flex:1;">Sign Up</button>`;
  }
});

/* ═══════════════ STATE ═══════════════ */
let ANIME_LIST   = [];   // from anime.json
let SHOW_DATA    = null; // the single anime object (from data/episodes/{id}.json)
let currentAnimeId = null;
let currentEpNum   = 1;
let episodeData    = [];
let liked = false;
let currentAudio = 'sub';

/* ═══════════════ INIT ═══════════════ */
async function init() {
  const params = new URLSearchParams(location.search);
  currentAnimeId = String(params.get('id') || '1');
  currentEpNum   = parseInt(params.get('ep') || '1', 10);

  try {
    const [showRes, animeRes] = await Promise.all([
      fetch(`data/episodes/${currentAnimeId}.json`),
      fetch('data/anime.json')
    ]);
    if (!showRes.ok) throw new Error('Episode file not found');
    SHOW_DATA  = await showRes.json();
    ANIME_LIST = await animeRes.json();
    // Normalize types: animeId → string, season → number (if present)
    SHOW_DATA.animeId = String(SHOW_DATA.animeId);
    // season stays as-is (string or number) so values like "1 Part 2" are preserved
  } catch (err) {
    showErrorScreen('Anime not found or failed to load. Check your connection.');
    return;
  }

  document.getElementById('errorScreen').style.display = 'none';
  document.getElementById('watchOuter').style.display  = 'block';

  renderDetailHero();
  loadShow(currentEpNum);
  renderMore();
  subscribeComments(currentAnimeId);

  // Sync URL so it always shows ?id=X&ep=Y from the start
  const initUrl = new URL(location.href);
  initUrl.searchParams.set('id', currentAnimeId);
  initUrl.searchParams.set('ep', currentEpNum);
  history.replaceState(null, '', initUrl);

  // Attach iframe load handler here so it's always defined
  document.getElementById('playerIframe').addEventListener('load', onIframeLoad);
}

/* ═══════════════ ERROR ═══════════════ */
function showErrorScreen(msg) {
  document.getElementById('errorScreen').style.display = 'flex';
  if (msg) document.querySelector('#errorScreen .error-sub').textContent = msg;
}

/* ═══════════════ DETAIL HERO ═══════════════ */
function renderDetailHero() {
  document.getElementById('detailHero').style.display = 'flex';
  document.getElementById('detailBg').style.background =
    `url('${SHOW_DATA.bgImg}') center top / cover no-repeat`;
  document.getElementById('detailPoster').src = SHOW_DATA.coverImg;
  document.getElementById('detailPoster').alt = SHOW_DATA.animeTitle;
  document.getElementById('detailTitle').textContent = SHOW_DATA.animeTitle;
  document.getElementById('detailDesc').textContent  = SHOW_DATA.description;

  const tags = [
    ...(SHOW_DATA.genres || []).map(g => `<span class="detail-tag genre">${g}</span>`),
    `<span class="detail-tag score">★ ${SHOW_DATA.score}</span>`,
    `<span class="detail-tag year">${SHOW_DATA.year}</span>`,
    SHOW_DATA.season ? `<span class="detail-tag season">${SHOW_DATA.season}</span>` : ''
  ];
  document.getElementById('detailTags').innerHTML = tags.join('');
}

/* ═══════════════ LOAD SHOW ═══════════════ */
function loadShow(epNum) {
  episodeData = SHOW_DATA.episodes || [];
  document.getElementById('epCount').textContent = `${episodeData.length} Episodes`;
  renderEpisodeList(epNum);
  playEpisode(epNum);
}

/* ═══════════════ EPISODE LIST ═══════════════ */
function renderEpisodeList(activeNum, filter = '') {
  const q    = filter.toLowerCase();
  const list = episodeData.filter(ep =>
    !q || ep.title.toLowerCase().includes(q) || String(ep.num).includes(q)
  );

  if (!list.length) {
    document.getElementById('epList').innerHTML =
      `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;">No episodes match your search.</div>`;
    return;
  }

  document.getElementById('epList').innerHTML = list.map(ep => `
    <div class="ep-item ${ep.num === activeNum ? 'active' : ''}"
         onclick="selectEp(${ep.num})" data-ep="${ep.num}">
      <div class="ep-num">${ep.num}</div>
      <div class="ep-info">
        <div class="ep-title">${ep.title}</div>
        <div class="ep-duration">⏱ ${ep.duration}</div>
      </div>
    </div>
  `).join('');

  setTimeout(() => {
    const active = document.querySelector('.ep-item.active');
    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 100);
}

function filterEpisodes() {
  const q = document.getElementById('epSearch').value;
  renderEpisodeList(currentEpNum, q);
}

/* ═══════════════ PLAY EPISODE ═══════════════ */

function onIframeLoad() {
  document.getElementById('playerLoading').style.display = 'none';
  document.getElementById('playerIframe').style.opacity  = '1';
}

/* ═══════════════ ACTIONS ═══════════════ */
function toggleLike() {
  if (!window.__currentUser) { openModal('login'); return; }
  liked = !liked;
  const btn = document.getElementById('likeBtn');
  btn.classList.toggle('active', liked);
  showToast(liked ? 'Episode liked! ❤' : 'Like removed', liked ? '❤' : '💔');
}

function toggleWatchFav() {
  if (!window.__currentUser) { openModal('login'); return; }
  toggleFavById(SHOW_DATA.animeId, null);
  const nowFav = isFav(SHOW_DATA.animeId);
  const favBtn = document.getElementById('favBtn');
  favBtn.classList.toggle('active', nowFav);
  favBtn.textContent = nowFav ? '❤ Favorited' : '⭐ Favorite';
}

function shareEp() {
  const url = location.href;
  navigator.clipboard?.writeText(url)
    .then(() => showToast('Link copied to clipboard!', '🔗'))
    .catch(() => showToast('Share: ' + url, '🔗'));
}

/* ═══════════════ PLAY EPISODE ═══════════════ */
function selectEp(num) {
  currentEpNum = num;
  const q = document.getElementById('epSearch').value;
  renderEpisodeList(num, q);
  playEpisode(num);
  const url = new URL(location.href);
  url.searchParams.set('ep', num);
  url.searchParams.set('id', currentAnimeId);
  history.replaceState(null, '', url);
  window.scrollTo({ top: document.getElementById('detailHero').offsetTop - 70, behavior: 'smooth' });
}

function playEpisode(num) {
  const ep = episodeData.find(e => e.num === num);
  if (!ep) return;
  currentEpNum = num;

  const iframe  = document.getElementById('playerIframe');
  const loading = document.getElementById('playerLoading');

  loading.style.display = 'flex';
  iframe.style.opacity  = '0';

  const embedSrc = ep.audio?.[currentAudio] || ep.audio?.sub || ep.embed || SHOW_DATA.defaultEmbed;
  iframe.src = embedSrc;

  document.title = `${SHOW_DATA.animeTitle} Ep.${ep.num} — Hanabi Live`;
  document.getElementById('watchTitle').textContent =
    `${SHOW_DATA.animeTitle}${SHOW_DATA.season ? ` — ${SHOW_DATA.season}` : ''}, Episode ${ep.num}: ${ep.title}`;

  document.getElementById('watchMeta').innerHTML = `
    <div class="video-meta-item">📅 ${SHOW_DATA.year}</div>
    ${SHOW_DATA.season ? `<div class="video-meta-item">🎬 ${SHOW_DATA.season}</div>` : ''}
    <div class="video-meta-item">📺 Episode ${ep.num} of ${episodeData.length}</div>
    <div class="video-meta-item">⏱ ${ep.duration}</div>
    <div class="video-meta-item" style="color:var(--accent-gold);">★ ${SHOW_DATA.score}</div>`;

  // Reset like; sync fav button
  document.getElementById('likeBtn').classList.remove('active');
  liked = false;
  const fav    = isFav(SHOW_DATA.animeId);
  const favBtn = document.getElementById('favBtn');
  favBtn.classList.toggle('active', fav);
  favBtn.textContent = fav ? '❤ Favorited' : '⭐ Favorite';
}

/* ═══════════════ SUB/DUB TOGGLE ═══════════════ */
function setAudio(mode) {
  currentAudio = mode;
  // Sync checkbox state
  const cbx = document.getElementById('audioCbx');
  if (cbx) cbx.checked = (mode === 'dub');
  // Highlight active label
  document.getElementById('subLabel').classList.toggle('active', mode === 'sub');
  document.getElementById('dubLabel').classList.toggle('active', mode === 'dub');
  playEpisode(currentEpNum);
}

/* ═══════════════ MORE ANIME ═══════════════ */
function renderMore() {
  if (!ANIME_LIST.length) return;
  const related = ANIME_LIST
    .filter(a => a.id !== SHOW_DATA.animeId)
    .sort((a, b) => b.score - a.score)
    .slice(0, 8);
  document.getElementById('moreGrid').innerHTML = related.map(makeCard).join('');
  document.getElementById('moreSection').style.display = 'block';
}

/* ═══════════════ COMMENTS (Firestore) ═══════════════ */
let _commentsUnsub = null; // holds the onSnapshot unsubscribe fn

/* Subscribe to live comments for the current anime */
function subscribeComments(animeId) {
  // Cancel any existing listener
  if (_commentsUnsub) { _commentsUnsub(); _commentsUnsub = null; }

  if (!window.__firebaseDb || !window.__firebaseOps) {
    renderComments([]); return;
  }

  const { collection, query, orderBy, onSnapshot } = window.__firebaseOps;
  const colRef = collection(window.__firebaseDb, 'anime', String(animeId), 'comments');
  const q      = query(colRef, orderBy('createdAt', 'desc'));

  // Show loading state
  document.getElementById('commentsList').innerHTML =
    `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;">Loading comments…</div>`;

  _commentsUnsub = onSnapshot(q, snap => {
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderComments(docs);
  }, err => {
    console.warn('Comments snapshot error:', err);
    renderComments([]);
  });
}

function renderComments(docs = []) {
  document.getElementById('commentCount').textContent = docs.length;

  if (!docs.length) {
    document.getElementById('commentsList').innerHTML =
      `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;">
         No comments yet — be the first!
       </div>`;
    return;
  }

  document.getElementById('commentsList').innerHTML = docs.map(c => {
    // Format timestamp
    let timeStr = 'just now';
    if (c.createdAt?.toDate) {
      const d   = c.createdAt.toDate();
      const now = Date.now();
      const diff = now - d.getTime();
      if      (diff < 60000)           timeStr = 'just now';
      else if (diff < 3600000)         timeStr = `${Math.floor(diff/60000)}m ago`;
      else if (diff < 86400000)        timeStr = `${Math.floor(diff/3600000)}h ago`;
      else                             timeStr = d.toLocaleDateString();
    }

    const avatarHtml = c.userImage
      ? `<img src="${c.userImage}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
      : (c.username || 'U')[0].toUpperCase();

    return `
      <div class="comment-item">
        <div class="comment-avatar" style="background:linear-gradient(135deg,#e63946,#9b59ff);overflow:hidden;">
          ${avatarHtml}
        </div>
        <div>
          <div class="comment-user">${escHtml(c.username || 'Otaku User')}<span>${timeStr}</span></div>
          <div class="comment-text">${escHtml(c.text)}</div>
        </div>
      </div>`;
  }).join('');
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function postComment() {
  const input = document.getElementById('commentInput');
  const text  = input.value.trim();
  if (!text) return;
  if (!window.__currentUser) { openModal('login'); return; }
  if (!window.__firebaseDb || !window.__firebaseOps) {
    showToast('Comments unavailable right now', '⚠️'); return;
  }

  const user    = window.__currentUser;
  // Pull latest profile from cache for username / avatar
  const profile = getProfileCache() || {};
  const username  = profile.name  || user.displayName || user.email?.split('@')[0] || 'Otaku User';
  const userImage = profile.photoBase64 || null;

  const { collection, addDoc, serverTimestamp } = window.__firebaseOps;
  const colRef = collection(window.__firebaseDb, 'anime', String(currentAnimeId), 'comments');

  const submitBtn = document.querySelector('.comment-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Posting…';

  try {
    await addDoc(colRef, {
      uid:       user.uid,
      username,
      userImage,
      text,
      createdAt: serverTimestamp(),
    });
    input.value = '';
    showToast('Comment posted!', '💬');
  } catch (e) {
    console.error('Comment post error:', e);
    showToast('Failed to post. Try again.', '❌');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Post Comment';
  }
}

/* ═══════════════ BOOT ═══════════════ */
init();
</script>
