<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, collectionGroup, query, where, orderBy, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey:"AIzaSyB6FFZb-APx-w1XmGe2GZj3nGMpUGhSNn0",
    authDomain:"hanabilive-dbh004.firebaseapp.com",
    projectId:"hanabilive-dbh004",
    storageBucket:"hanabilive-dbh004.firebasestorage.app",
    messagingSenderId:"370285575457",
    appId:"1:370285575457:web:30a958f74c32c2a59c1260"
  };
  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  window.__firebaseAuth = auth;
  window.__firebaseDb   = db;
  window.__firebaseOps  = { signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, doc, setDoc, getDoc, collection, collectionGroup, query, where, orderBy, getDocs, deleteDoc };
  onAuthStateChanged(auth, user => {
    window.__currentUser = user;
    document.dispatchEvent(new CustomEvent('authStateChanged', { detail: user }));
  });
</script>

<style>
body { padding-top: 70px; }

/* ── signed-out screen ── */
.signed-out-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100vh - 70px); flex-direction: column; gap: 20px;
  position: relative; z-index: 2;
}
.signed-out-icon  { font-size: 80px; }
.signed-out-title { font-family: 'Cinzel Decorative', serif; font-size: 24px; }
.signed-out-sub   { color: var(--text-muted); font-size: 15px; }

/* ── profile hero ── */
.profile-hero {
  display: flex; align-items: center; gap: 36px;
  padding: 48px 60px 32px;
  position: relative; z-index: 2;
  border-bottom: 1px solid var(--border);
}

/* ── avatar wrapper ── */
.profile-avatar-wrap { position: relative; flex-shrink: 0; }
.profile-avatar {
  width: 100px; height: 100px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-red), var(--accent-purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; font-weight: 700; color: #fff;
  border: 3px solid var(--accent-red);
  box-shadow: var(--glow-red);
  overflow: hidden;
}
.profile-avatar img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
}

/* ── upload button overlay on avatar ── */
.avatar-upload-btn {
  position: absolute; bottom: 0; right: 0;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent-purple); border: 2px solid var(--bg-deep);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: var(--glow-purple);
}
.avatar-upload-btn:hover { transform: scale(1.15); }
#avatarFileInput { display: none; }

.profile-name {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(20px, 3vw, 32px);
  font-weight: 700; margin-bottom: 4px;
}
.profile-stats {
  display: flex; gap: 32px; margin-top: 16px;
}
.profile-stat { text-align: center; }
.profile-stat-num {
  font-size: 28px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-red));
  background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  display: block;
}
.profile-stat-label {
  font-size: 11px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-muted); margin-top: 2px;
}

/* ── uploading spinner ── */
.avatar-uploading {
  position: absolute; inset: 0; border-radius: 50%;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  animation: pulse 1s infinite;
}

/* ── comments section ── */
.my-comment-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  transition: border-color 0.3s, box-shadow 0.3s;
  position: relative;
}
.my-comment-card:hover {
  border-color: rgba(155,89,255,0.4);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.my-comment-avatar {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent-red), var(--accent-purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #fff; overflow: hidden;
  border: 2px solid rgba(155,89,255,0.3);
}
.my-comment-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.my-comment-body { flex: 1; min-width: 0; }
.my-comment-anime {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--accent-teal);
  margin-bottom: 6px; cursor: pointer; text-decoration: none;
}
.my-comment-anime:hover { color: var(--accent-gold); }
.my-comment-anime::before { content: '▶'; font-size: 9px; }
.my-comment-text {
  font-size: 14px; color: rgba(232,234,246,0.82); line-height: 1.65;
  word-break: break-word;
}
.my-comment-meta {
  font-size: 11px; color: var(--text-muted); margin-top: 8px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.my-comment-del {
  margin-left: auto; flex-shrink: 0;
  background: rgba(230,57,70,0.08); border: 1px solid rgba(230,57,70,0.25);
  color: var(--accent-red); border-radius: 6px;
  padding: 5px 12px; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.25s;
  font-family: 'Stack Sans Headline', sans-serif; letter-spacing: 0.5px;
}
.my-comment-del:hover { background: var(--accent-red); color: #fff; box-shadow: var(--glow-red); }
.my-comment-del.confirming {
  background: var(--accent-red); color: #fff;
  animation: pulse 0.6s ease infinite;
}
.comments-list-wrap {
  display: flex; flex-direction: column; gap: 12px;
}
.comments-empty {
  color: var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px;
}
.comments-loading {
  color: var(--text-muted); text-align: center; padding: 40px 20px; font-size: 14px;
}

@media(max-width: 768px) {
  .profile-hero { flex-direction: column; padding: 24px; text-align: center; }
  .profile-stats { justify-content: center; }
}

</style>
</head>
<body>
<div class="noise-overlay"></div>
<div id="authModalMount"></div>

  <span class="toast-icon" id="toast-icon">✨</span>
  <span id="toast-msg"></span>
</div>

<!-- NAV -->
<nav id="mainNav">
  <a class="nav-logo" href="index.html">⛩ Hanabi Live</a>
  <div class="nav-links">
    <a class="nav-link" href="index.html"    data-page="index.html">Home</a>
    <a class="nav-link" href="browse.html"   data-page="browse.html">Browse</a>
    <a class="nav-link" href="schedule.html" data-page="schedule.html">Schedule</a>
    <a class="nav-link active" href="profile.html" data-page="profile.html">Profile</a>
  </div>

    <button class="btn btn-outline" onclick="openModal('login')">Log In</button>
  </div>
</nav>

<!-- LOGGED OUT -->
<div id="profileLoggedOut" class="signed-out-screen">
  <div class="signed-out-icon">🔒</div>
  <div class="signed-out-title">Sign In Required</div>
  <div class="signed-out-sub">Please sign in to view your profile and activity</div>
  <button class="btn btn-primary" onclick="openModal('login')">Sign In with Google</button>
</div>

<!-- LOGGED IN -->
<div id="profileLoggedIn" style="display:none;">

  <div class="profile-hero">
    <!-- Avatar with upload -->
    <div class="profile-avatar-wrap">
      <div class="profile-avatar" id="profileAvatar">
        <span id="profileAvatarLetter">U</span>
      </div>
      <div class="avatar-upload-btn" title="Change photo" onclick="document.getElementById('avatarFileInput').click()">📷</div>
      <input type="file" id="avatarFileInput" accept="image/*" onchange="handleAvatarUpload(event)">
    </div>

    <!-- Info -->
    <div>
      <div class="profile-name" id="profileName">Otaku User</div>
      <div style="color:var(--text-muted);font-size:14px;" id="profileEmail">user@example.com</div>
      <div class="profile-stats">
        <div class="profile-stat">
          <span class="profile-stat-num" id="statFavs">0</span>
          <div class="profile-stat-label">Favorites</div>
        </div>
        <div class="profile-stat">
          <span class="profile-stat-num" id="statComments">0</span>
          <div class="profile-stat-label">Comments</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Favorites Grid -->
  <div class="section">
    <div class="section-header">
      <div class="section-tag">⭐ Your List</div>
      <h2 class="section-title">My <span>Favorites</span></h2>
    </div>
    <div class="anime-grid" id="favoritesGrid">
      <div style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:60px;font-size:16px;">
        No favorites yet. Browse anime and click ❤ to add!
      </div>
    </div>
  </div>

  <!-- My Comments -->
  <div class="section" style="padding-top:0;">
    <div class="section-header">
      <div class="section-tag">💬 Activity</div>
      <h2 class="section-title">My <span>Comments</span></h2>
    </div>
    <div class="comments-list-wrap" id="myCommentsList">
      <div class="comments-loading">Loading your comments…</div>
    </div>
  </div>

</div><!-- /profileLoggedIn -->

<script src="assets/js/core.js"></script>
<script>
mountAuthModal();

let ANIME_LIST = [];

async function loadAnime() {
  const res = await fetch('data/anime.json');
  ANIME_LIST = await res.json();
}

/* ── helpers ── */
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function animeNameById(id) {
  const a = ANIME_LIST.find(a => String(a.id) === String(id));
  return a ? a.title : `Anime #${id}`;
}

function fmtTime(ts) {
  if (!ts) return '';
  // Handle Firestore Timestamp objects
  const d = ts?.toDate ? ts.toDate() : (typeof ts === 'number' ? new Date(ts) : new Date(ts));
  if (isNaN(d.getTime())) return '';
  const diff = Date.now() - d.getTime();
  if (diff < 60000)    return 'just now';
  if (diff < 3600000)  return `${Math.floor(diff/60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
  return d.toLocaleDateString();
}

/* ── render favorites grid ── */
function updateProfileFavs() {
  const favIds    = getFavs();
  const favAnimes = ANIME_LIST.filter(a => favIds.includes(a.id));
  document.getElementById('statFavs').textContent = favAnimes.length;
  document.getElementById('favoritesGrid').innerHTML = favAnimes.length
    ? favAnimes.map(makeCard).join('')
    : '<div style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:60px;font-size:16px;">No favorites yet. Browse anime and click ❤ to add!</div>';
}
window.updateProfileFavs = updateProfileFavs;

/* ── load & render user comments ── */
async function loadMyComments(uid) {
  const listEl = document.getElementById('myCommentsList');
  listEl.innerHTML = '<div class="comments-loading">⏳ Loading your comments…</div>';

  if (!window.__firebaseDb || !window.__firebaseOps) {
    listEl.innerHTML = '<div class="comments-empty">Comments unavailable.</div>';
    return;
  }

  const { collectionGroup, query, where, getDocs } = window.__firebaseOps;

  try {
    // ── Query WITHOUT orderBy to avoid needing a composite index ──
    // We sort client-side instead so no Firestore index setup is needed.
    const q    = query(
      collectionGroup(window.__firebaseDb, 'comments'),
      where('uid', '==', uid)
    );
    const snap = await getDocs(q);

    // Update the counter with the real live count from Firestore
    document.getElementById('statComments').textContent = snap.size;

    if (snap.empty) {
      listEl.innerHTML = '<div class="comments-empty">No comments yet — go discuss some anime! 🎌</div>';
      return;
    }

    // Sort newest-first on the client side
    const docs = snap.docs.slice().sort((a, b) => {
      const tsA = a.data().createdAt;
      const tsB = b.data().createdAt;
      const getMs = ts => ts?.toDate ? ts.toDate().getTime() : (typeof ts === 'number' ? ts : 0);
      return getMs(tsB) - getMs(tsA);
    });

    listEl.innerHTML = docs.map(d => {
      const c       = d.data();
      // ref path: anime/{animeId}/comments/{commentId}
      const animeId = d.ref.parent.parent?.id || '';
      const title   = animeNameById(animeId);
      const time    = fmtTime(c.createdAt);

      const avatarHtml = c.userImage
        ? `<img src="${c.userImage}" alt="avatar">`
        : escHtml((c.username || 'U')[0].toUpperCase());

      return `
        <div class="my-comment-card" id="ccard-${d.id}">
          <div class="my-comment-avatar">${avatarHtml}</div>
          <div class="my-comment-body">
            <a class="my-comment-anime" href="watch.html?id=${escHtml(animeId)}">${escHtml(title)}</a>
            <div class="my-comment-text">${escHtml(c.text)}</div>
            <div class="my-comment-meta">
              <span>🕐 ${time}</span>
            </div>
          </div>
          <button class="my-comment-del"
                  onclick="deleteComment(this,'${escHtml(animeId)}','${d.id}')">
            🗑 Delete
          </button>
        </div>`;
    }).join('');

  } catch (err) {
    console.error('Load comments error:', err);
    listEl.innerHTML = `<div class="comments-empty">Could not load comments.<br><small style="opacity:0.6;">${err.message}</small></div>`;
  }
}

/* ── delete comment ── */
let _delConfirmTimer = null;
async function deleteComment(btn, animeId, commentId) {
  // Two-tap confirm: first tap changes button, second tap deletes
  if (!btn.classList.contains('confirming')) {
    btn.classList.add('confirming');
    btn.textContent = '⚠ Confirm?';
    clearTimeout(_delConfirmTimer);
    _delConfirmTimer = setTimeout(() => {
      btn.classList.remove('confirming');
      btn.textContent = '🗑 Delete';
    }, 3000);
    return;
  }

  // Confirmed — delete
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const { doc, deleteDoc } = window.__firebaseOps;
    const ref = doc(window.__firebaseDb, 'anime', animeId, 'comments', commentId);
    await deleteDoc(ref);

    // Fade out card
    const card = document.getElementById(`ccard-${commentId}`);
    if (card) {
      card.style.transition = 'opacity 0.3s, transform 0.3s';
      card.style.opacity    = '0';
      card.style.transform  = 'translateX(20px)';
      setTimeout(() => card.remove(), 350);
    }

    // Update count
    const countEl = document.getElementById('statComments');
    countEl.textContent = Math.max(0, parseInt(countEl.textContent || '0') - 1);

    // If nothing left
    const listEl = document.getElementById('myCommentsList');
    if (!listEl.querySelector('.my-comment-card')) {
      listEl.innerHTML = '<div class="comments-empty">No comments yet — go discuss some anime! 🎌</div>';
    }

    showToast('Comment deleted', '🗑');
  } catch (e) {
    console.error('Delete error:', e);
    btn.disabled  = false;
    btn.textContent = '🗑 Delete';
    btn.classList.remove('confirming');
    showToast('Delete failed. Try again.', '❌');
  }
}

/* ── render full profile from cache ── */
function renderProfile(user) {
  document.getElementById('profileLoggedOut').style.display = 'none';
  document.getElementById('profileLoggedIn').style.display  = 'block';

  const profile = getProfileCache() || {};
  const name    = profile.name  || user.displayName || user.email?.split('@')[0] || 'Otaku User';
  const email   = profile.email || user.email || '';
  const photo   = profile.photoBase64 || null;

  document.getElementById('profileName').textContent  = name;
  document.getElementById('profileEmail').textContent = email;

  const avatarEl = document.getElementById('profileAvatar');
  const letterEl = document.getElementById('profileAvatarLetter');

  if (photo) {
    letterEl.style.display = 'none';
    const oldImg = avatarEl.querySelector('img');
    if (oldImg) oldImg.remove();
    const img = document.createElement('img');
    img.src = photo;
    avatarEl.appendChild(img);
  } else {
    letterEl.style.display = '';
    letterEl.textContent   = name[0].toUpperCase();
    const oldImg = avatarEl.querySelector('img');
    if (oldImg) oldImg.remove();
  }

  updateProfileFavs();
  loadMyComments(user.uid);
}

/* ── avatar photo upload ── */
async function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    showToast('Image too large (max 2MB)', '⚠️'); return;
  }
  const avatarEl = document.getElementById('profileAvatar');
  const spinner  = document.createElement('div');
  spinner.className   = 'avatar-uploading';
  spinner.textContent = '⏳';
  avatarEl.appendChild(spinner);

  try {
    const base64 = await fileToBase64(file);
    await saveProfilePhoto(base64);
    spinner.remove();
    document.getElementById('profileAvatarLetter').style.display = 'none';
    const oldImg = avatarEl.querySelector('img');
    if (oldImg) oldImg.remove();
    const img = document.createElement('img');
    img.src = base64;
    avatarEl.appendChild(img);
    showToast('Profile photo updated! 📸', '📸');
    document.dispatchEvent(new CustomEvent('authStateChanged', { detail: window.__currentUser }));
  } catch (e) {
    spinner.remove();
    showToast('Upload failed. Try again.', '❌');
    console.error(e);
  }
  event.target.value = '';
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ── boot sequence ── */
let animeReady = false;

loadAnime().then(() => {
  animeReady = true;
  if (window.__currentUser) renderProfile(window.__currentUser);
});

document.addEventListener('authStateChanged', e => {
  const user = e.detail;
  if (user) {
    setTimeout(() => {
      if (animeReady) renderProfile(user);
    }, 80);
  } else {
    document.getElementById('profileLoggedIn').style.display  = 'none';
    document.getElementById('profileLoggedOut').style.display = 'flex';
  }
});
</script>
</body>
