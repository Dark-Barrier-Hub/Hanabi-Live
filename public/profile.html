    </div>
    <div class="anime-grid" id="favoritesGrid">
      <div style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:60px;font-size:16px;">
        No favorites yet. Browse anime and click ❤ to add!
      </div>
    </div>
  </div>

<script src="assets/js/core.js"></script>
<script>
mountAuthModal();

let ANIME_LIST = [];

async function loadAnime() {
  const res = await fetch('data/anime.json');
  ANIME_LIST = await res.json();
}

function updateProfileFavs() {
  const favIds   = getFavs();
  const favAnimes = ANIME_LIST.filter(a => favIds.includes(a.id));
  document.getElementById('statFavs').textContent = favAnimes.length;
  document.getElementById('favoritesGrid').innerHTML = favAnimes.length
    ? favAnimes.map(makeCard).join('')
    : '<div style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:60px;font-size:16px;">No favorites yet. Browse anime and click ❤ to add!</div>';
}
window.updateProfileFavs = updateProfileFavs;

let animeReady = false;

loadAnime().then(() => {
  animeReady = true;
  if (window.__currentUser) renderProfile(window.__currentUser);
});

document.addEventListener('authStateChanged', e => {
  const user = e.detail;
  if (user) {
    if (animeReady) renderProfile(user);
  } else {
    document.getElementById('profileLoggedIn').style.display  = 'none';
    document.getElementById('profileLoggedOut').style.display = 'flex';
  }
});

function renderProfile(user) {
  document.getElementById('profileLoggedOut').style.display = 'none';
  document.getElementById('profileLoggedIn').style.display  = 'block';
  document.getElementById('profileName').textContent         = user.displayName || user.email?.split('@')[0] || 'Otaku User';
  document.getElementById('profileEmail').textContent        = user.email || '';
  document.getElementById('profileAvatarLetter').textContent = (user.displayName || user.email || 'U')[0].toUpperCase();
  updateProfileFavs();
}
</script>
