  <div class="schedule-grid" id="scheduleGrid"></div>
</div>

<script src="assets/js/core.js"></script>
<script>
mountAuthModal();

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_SHORT = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const SCHEDULE = {
  Monday:    [{time:'00:00',title:'One Piece',ep:'Ep 1109'},{time:'01:30',title:'Naruto Shippuden',ep:'Ep 421'}],
  Tuesday:   [{time:'00:00',title:'Jujutsu Kaisen',ep:'Ep 49'},{time:'01:00',title:'Spy x Family',ep:'Ep 38'}],
  Wednesday: [{time:'00:00',title:'That Time I Got Reincarnated as a Slime',ep:'Ep 26'},{time:'01:00',title:'Re:Zero S3',ep:'Ep 14'}],
  Thursday:  [{time:'00:30',title:'Demon Slayer',ep:'Ep 45'},{time:'02:00',title:'Vinland Saga',ep:'Ep 25'}],
  Friday:    [{time:'00:00',title:'Attack on Titan',ep:'Ep 88'},{time:'01:00',title:'Dragon Ball Super',ep:'Ep 132'}],
  Saturday:  [{time:'00:00',title:'My Hero Academia',ep:'Ep 139'},{time:'01:30',title:'Bleach: TYBW',ep:'Ep 27'},{time:'03:00',title:'Hunter x Hunter',ep:'Ep 149'}],
  Sunday:    [{time:'00:00',title:'FMA: Brotherhood',ep:'Ep 65'},{time:'01:00',title:'Tokyo Ghoul',ep:'Ep 49'},{time:'02:00',title:'Sword Art Online',ep:'Ep 97'}],
};

function getTodayName() {
  const d = new Date().getDay(); // 0=Sun
  return DAYS[d === 0 ? 6 : d - 1];
}

function renderSchedule() {
  const today = getTodayName();
  const todayItems = SCHEDULE[today] || [];
  document.getElementById('todayHighlight').innerHTML = `
    <div class="today-dot"></div>
    <div>
      <strong>Today is ${today}</strong> —
      ${todayItems.length ? `${todayItems.length} episode${todayItems.length>1?'s':''} airing: ${todayItems.map(i=>i.title).join(', ')}` : 'No new episodes today. Catch up on your list!'}
    </div>`;

  document.getElementById('scheduleGrid').innerHTML = DAYS.map((day, i) => `
    <div class="schedule-day">
      <div class="day-header ${day === today ? 'today' : ''}">${DAY_SHORT[i]}${day === today ? ' ●' : ''}</div>
      ${(SCHEDULE[day] || []).map(s => `
        <div class="schedule-item" onclick="location.href='browse.html'">
          <div class="sch-time">${s.time}</div>
          <div class="sch-title">${s.title}</div>
          <div class="sch-ep">${s.ep}</div>
        </div>`).join('')}
    </div>`).join('');
}

renderSchedule();
</script>
